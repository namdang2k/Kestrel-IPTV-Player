// AGP must match Unity 6000.6's bundled Gradle 9.3.1 (Unity template uses AGP 9.1.1).
plugins {
    id 'com.android.library' version '9.1.1'
}

// Keep in sync with Assets/Plugins/Android/mainTemplate.gradle: the .aar does not bundle its dependencies.
def media3 = '1.11.1'

android {
    namespace 'com.stbemu.host'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-datasource-okhttp:$media3"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.android.billingclient:billing:9.0.0' // Match Unity IAP's billing version
    implementation 'com.google.android.gms:play-services-ads:25.4.0' // Match mainTemplate.gradle AdMob version
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

// ./gradlew copyToUnity -> builds release .aar into the Unity project
tasks.register('copyToUnity', Copy) {
    dependsOn 'assembleRelease'
    from layout.buildDirectory.file('outputs/aar/StbHost-release.aar')
    into '../../Assets/Plugins/Android'
    rename { 'StbHost.aar' }
}
